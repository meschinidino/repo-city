[package]
name = "repo-city-server"
version = "0.2.0"
edition = "2021"
description = "Repo City server: Oxc/RustPython extraction, normalized events, SQLite store, watcher, Axum + WebSocket live loop."
license = "MIT"

[lib]
name = "repo_city_server"
path = "src/lib.rs"

[[bin]]
name = "repo-city-extract"
path = "src/bin/repo-city-extract.rs"

[[bin]]
name = "repo-city-server-bin"
path = "src/bin/repo-city-server.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
oxc_resolver = "11"
rustpython-parser = "0.4"
rustpython-ast = { version = "0.4", features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.26"
libc = "0.2"
